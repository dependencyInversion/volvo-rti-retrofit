[project]
name = "hudiy-client"
version = "0.1.0"
description = "WebSocket/Protobuf client for the Hudiy in-car API"
authors = [
    { name = "Jan", email = "wennmann@protonmail.com" }
]
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "protobuf (>=4.25,<5.0)",
    "websocket-client (>=1.8,<2.0)"
]

[project.scripts]
airplay-bridge = "hudiy_client.apps.airplay_bridge:main"

[tool.poetry]
packages = [{ include = "hudiy_client" }]

[tool.poetry.group.dev.dependencies]
grpcio-tools = "^1.62"

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
