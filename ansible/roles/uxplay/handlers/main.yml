---
- name: Restart uxplay
  ansible.builtin.systemd:
    name: uxplay
    scope: user
    daemon_reload: true
    state: restarted
  become: true
  become_user: "{{ ansible_user }}"
  environment:
    XDG_RUNTIME_DIR: "/run/user/{{ ansible_facts['user_uid'] }}"

- name: Restart airplay-bridge
  ansible.builtin.systemd:
    name: airplay-bridge
    scope: user
    daemon_reload: true
    state: restarted
  become: true
  become_user: "{{ ansible_user }}"
  environment:
    XDG_RUNTIME_DIR: "/run/user/{{ ansible_facts['user_uid'] }}"

- name: Restart hudiy-wifi-fallback
  ansible.builtin.systemd:
    name: hudiy-wifi-fallback
    scope: user
    daemon_reload: true
    state: restarted
  become: true
  become_user: "{{ ansible_user }}"
  environment:
    XDG_RUNTIME_DIR: "/run/user/{{ ansible_facts['user_uid'] }}"

# labwc re-reads rc.xml on SIGHUP; a no-op when no labwc session is running.
- name: Reconfigure labwc
  ansible.builtin.command: pkill -HUP -x labwc
  become: true
  become_user: "{{ ansible_user }}"
  changed_when: true
  failed_when: false
