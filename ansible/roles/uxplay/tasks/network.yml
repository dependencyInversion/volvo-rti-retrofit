---
# Wi-Fi while Hudiy is not running - see templates/hudiy-wifi-fallback.sh.j2.
# Hudiy's own Wi-Fi/hotspot configuration is deliberately left untouched.

- name: Deploy the Wi-Fi fallback script
  ansible.builtin.template:
    src: hudiy-wifi-fallback.sh.j2
    dest: "{{ uxplay_bin_dir }}/hudiy-wifi-fallback.sh"
    mode: "0755"
  become: true
  become_user: "{{ ansible_user }}"
  notify: Restart hudiy-wifi-fallback

- name: Deploy the Wi-Fi fallback systemd user service
  ansible.builtin.template:
    src: hudiy-wifi-fallback.service.j2
    dest: "{{ uxplay_systemd_user_dir }}/hudiy-wifi-fallback.service"
    mode: "0644"
  become: true
  become_user: "{{ ansible_user }}"
  notify: Restart hudiy-wifi-fallback

- name: Enable and start the Wi-Fi fallback systemd user service
  ansible.builtin.systemd:
    name: hudiy-wifi-fallback
    scope: user
    daemon_reload: true
    enabled: true
    state: started
  become: true
  become_user: "{{ ansible_user }}"
  environment:
    XDG_RUNTIME_DIR: "/run/user/{{ ansible_facts['user_uid'] }}"
