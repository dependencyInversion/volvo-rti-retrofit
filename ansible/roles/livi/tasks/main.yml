---
- name: Get default systemd boot target
  ansible.builtin.command: systemctl get-default
  register: livi_boot_target
  changed_when: false

- name: Verify OS is Raspberry Pi OS Lite (required by LIVI)
  ansible.builtin.assert:
    that:
      - ansible_facts['distribution'] == "Debian"
      - ansible_facts['architecture'] == "aarch64"
      - livi_boot_target.stdout == "multi-user.target"
    fail_msg: >-
      LIVI requires Raspberry Pi OS Lite (64-bit).
      Detected: {{ ansible_facts['distribution'] }} {{ ansible_facts['distribution_release'] }}
      ({{ ansible_facts['architecture'] }}), boot target "{{ livi_boot_target.stdout }}".
      Flash the Lite image instead - LIVI will not work on the Desktop variant.
    success_msg: "OS check passed: Raspberry Pi OS Lite (64-bit)."

- name: Create working directory for LIVI installer
  ansible.builtin.file:
    path: "/home/{{ ansible_user }}/livi-install"
    state: directory
    mode: "0755"
  become: true
  become_user: "{{ ansible_user }}"

- name: Download LIVI install script
  ansible.builtin.get_url:
    url: https://raw.githubusercontent.com/f-io/LIVI/main/scripts/install/install.sh
    dest: "/home/{{ ansible_user }}/livi-install/install.sh"
    mode: "0755"
    force: true

- name: Install pexpect (required by the expect module on the target)
  ansible.builtin.apt:
    name: python3-pexpect
    state: present
  become: true

- name: Run the LIVI headless installer and answer the build-channel prompt
  ansible.builtin.expect:
    command: ./install.sh --headless
    chdir: "/home/{{ ansible_user }}/livi-install"
    responses:
      ? |-
        Which build should be installed\?
        1\) release   the latest tagged release
        2\) nightly   the latest build of main
        Choice \[1\]:
      : "{{ '1' if livi_channel == 'release' else '2' }}"
    timeout: 900
  environment:
    LIVI_CHANNEL: "{{ livi_channel }}"
    LIVI_HDMI_PR: "{{ livi_hdmi_pr }}"
    LIVI_HDMI_PR_EDID: "{{ livi_hdmi_pr_edid }}"
    LIVI_MFI: "{{ livi_mfi }}"
    LIVI_SPLASH: "{{ livi_splash }}"
  register: livi_install_result
  changed_when: true

- name: Show LIVI installer output
  ansible.builtin.debug:
    var: livi_install_result.stdout_lines
